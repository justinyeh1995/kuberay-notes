html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;finalizer-flow&quot; lang=&quot;zh-Hant&quot;&gt;
  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot;&gt;程式版本&lt;select id=&quot;mode&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;current&quot;&gt;目前 PR&lt;/option&gt;&lt;option value=&quot;proposed&quot;&gt;調整後：先移除 idle finalizer&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;刪除情境&lt;select id=&quot;scenario&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;both&quot;&gt;P1：Redis cleanup 開啟，R + I&lt;/option&gt;&lt;option value=&quot;redis&quot;&gt;Redis cleanup 開啟，只有 R&lt;/option&gt;&lt;option value=&quot;idle&quot;&gt;無 Redis cleanup，只有 I&lt;/option&gt;&lt;option value=&quot;stale&quot;&gt;Redis cleanup 關閉，殘留 R + I&lt;/option&gt;&lt;option value=&quot;disabled&quot;&gt;Idle termination 停用，殘留 I&lt;/option&gt;&lt;option value=&quot;rocks&quot;&gt;RocksDB backend，殘留 R + I&lt;/option&gt;&lt;option value=&quot;none&quot;&gt;沒有 finalizer&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;Redis cleanup 結果&lt;select id=&quot;outcome&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;success&quot;&gt;Job 成功&lt;/option&gt;&lt;option value=&quot;pending&quot;&gt;Job 執行中&lt;/option&gt;&lt;option value=&quot;failed&quot;&gt;Job 失敗&lt;/option&gt;&lt;option value=&quot;timeout&quot;&gt;刪除超時（head 已消失）&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;viz-row legend&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;R：Redis cleanup finalizer&lt;/span&gt;&lt;span class=&quot;viz-badge&quot;&gt;I：Idle termination finalizer&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;text-small scope&quot;&gt;前提：validation 通過、DeletionTimestamp 已設定、沒有其他 finalizer；省略 API 錯誤重試。&lt;/div&gt;
  &lt;ol id=&quot;trace&quot; aria-label=&quot;Reconcile 執行路徑&quot; aria-live=&quot;polite&quot;&gt;&lt;/ol&gt;
  &lt;div id=&quot;result&quot; role=&quot;status&quot;&gt;&lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;查看分支順序與 return 差異&lt;/summary&gt;&lt;pre id=&quot;order&quot;&gt;&lt;/pre&gt;&lt;/details&gt;
  &lt;div class=&quot;text-small scope&quot;&gt;Redis cleanup 清除 cluster 的 storage namespace 資料，不是刪除 Redis server。調整版只改處理順序與 return 條件，仍保留原本的功能開關判斷。&lt;/div&gt;
&lt;/div&gt;
&lt;style&gt;
 #finalizer-flow {color:var(--foreground); overflow-wrap:anywhere}
 #finalizer-flow .legend {margin-block:20px 12px}
 #finalizer-flow .scope {margin-block:12px;color:var(--muted-foreground)}
 #finalizer-flow ol {list-style:none;padding:0;margin:24px 0}
 #finalizer-flow li {position:relative;margin:0 0 0 12px;padding:0 0 24px 26px;border-left:2px solid var(--border)}
 #finalizer-flow li:last-child {padding-bottom:0;border-left-color:transparent}
 #finalizer-flow li:before {content:&#x27;&#x27;;position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--viz-series-1)}
 #finalizer-flow li.blocked:before {background:var(--viz-series-3)}
 #finalizer-flow li small {display:block;color:var(--muted-foreground);margin-top:4px}
 #finalizer-flow #result {border-left:4px solid var(--viz-series-1);padding:8px 16px;margin-block:20px}
 #finalizer-flow #result.blocked {border-left-color:var(--viz-series-3)}
 #finalizer-flow details {margin-block:24px}
 #finalizer-flow pre {white-space:pre-wrap;overflow-wrap:anywhere}
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
 const root = document.getElementById(&#x27;finalizer-flow&#x27;);
 const mode = root.querySelector(&#x27;#mode&#x27;), scenario = root.querySelector(&#x27;#scenario&#x27;), outcome = root.querySelector(&#x27;#outcome&#x27;);
 const trace = root.querySelector(&#x27;#trace&#x27;), result = root.querySelector(&#x27;#result&#x27;), order = root.querySelector(&#x27;#order&#x27;);
 function draw() {
  const proposed = mode.value === &#x27;proposed&#x27;, s = scenario.value, o = outcome.value;
  outcome.disabled = ![&#x27;both&#x27;,&#x27;redis&#x27;].includes(s);
  trace.replaceChildren();
  function step(title, detail, blocked=false) {
   const li = document.createElement(&#x27;li&#x27;), label = document.createElement(&#x27;div&#x27;), sub = document.createElement(&#x27;small&#x27;);
   label.textContent = title; sub.textContent = detail; sub.className = &#x27;text-small&#x27;;
   li.className = blocked ? &#x27;blocked&#x27; : &#x27;&#x27;; li.append(label,sub); trace.append(li);
  }
  function finish(text, blocked=false) {result.textContent = text; result.className = blocked ? &#x27;blocked&#x27; : &#x27;&#x27;;}
  const initials = {both:&#x27;[R, I]&#x27;,redis:&#x27;[R]&#x27;,idle:&#x27;[I]&#x27;,stale:&#x27;[R, I]&#x27;,disabled:&#x27;[I]&#x27;,rocks:&#x27;[R, I]&#x27;,none:&#x27;[]&#x27;};
  step(&#x27;刪除請求已送出&#x27;, &#x27;Finalizers：&#x27;+initials[s]);
  order.textContent = proposed ? &#x27;Validation\n↓\n正在刪除 + idle 啟用 + 存在 I？\n  是 → 移除 I → Update → requeue + return\n  否 → 繼續往下（不可無條件 return）\n↓\nRocksDB：移除舊 R → return\n↓\nRedis cleanup：依原本流程處理 → return\n↓\n一般刪除 guard → return&#x27; : &#x27;Validation\n↓\nRocksDB：移除舊 R → return\n↓\nRedis cleanup 設定啟用？\n  是且正在刪除 → cleanup 分支 → 每條路徑皆 return\n  注意：進入條件不要求 R 存在！\n↓\nIdle 啟用且正在刪除？\n  有 I → 移除 I → Update\n  不論有沒有 I → return\n↓\n一般刪除 guard → return&#x27;;
  if(s===&#x27;none&#x27;) {step(&#x27;沒有 finalizer 阻擋&#x27;, &#x27;Controller 不保證還能讀到此 RayCluster。&#x27;);finish(&#x27;可完成刪除；不能依賴後續 reconcile 執行 cleanup。&#x27;);return;}
  if(s===&#x27;disabled&#x27;) {step(&#x27;Idle 功能開關不符合&#x27;, &#x27;IsIdleTerminationOptionsEnabled = false → 跳過移除 I。&#x27;,true);step(&#x27;一般刪除 guard → return&#x27;,&#x27;Finalizers：[I]&#x27;,true);finish(&#x27;卡住：單純移動順序不會修正功能停用後殘留 I 的情況。&#x27;,true);return;}
  if(s===&#x27;rocks&#x27;) {
   step(proposed?&#x27;移除 I → Update → requeue + return&#x27;:&#x27;移除舊 R → Update → return&#x27;, proposed?&#x27;Finalizers：[R]&#x27;:&#x27;Finalizers：[I]&#x27;);
   step(&#x27;下一輪 reconcile&#x27;,proposed?&#x27;RocksDB 分支移除舊 R。&#x27;:&#x27;RocksDB 分支已無 R，往下移除 I。&#x27;);
   finish(&#x27;可完成刪除。RocksDB 的舊 R 分支本來就不執行 Redis cleanup。&#x27;);return;
  }
  if(proposed &amp;&amp; [&#x27;both&#x27;,&#x27;idle&#x27;,&#x27;stale&#x27;].includes(s)) step(&#x27;移除 I → Update → requeue + return&#x27;,s===&#x27;idle&#x27;?&#x27;Finalizers：[]&#x27;:&#x27;Finalizers：[R]；R 仍阻擋刪除。&#x27;);
  if(s===&#x27;idle&#x27;) {if(!proposed) step(&#x27;跳過 Redis cleanup → 移除 I&#x27;,&#x27;Update → return；Finalizers：[]&#x27;);finish(&#x27;可完成刪除；此情境沒有 Redis cleanup finalizer。&#x27;);return;}
  if(s===&#x27;stale&#x27;) {step(&#x27;Redis cleanup 開關關閉 → 跳過&#x27;,&#x27;舊 R 不會被這個分支移除。&#x27;,true);if(!proposed) step(&#x27;移除 I → Update → return&#x27;,&#x27;Finalizers：[R]&#x27;);finish(&#x27;卡住：殘留 R；更動 I 的順序無法解決。&#x27;,true);return;}
  step(proposed &amp;&amp; s===&#x27;both&#x27;?&#x27;下一輪：I 不存在 → 繼續到 Redis cleanup&#x27;:&#x27;進入 Redis cleanup 分支&#x27;,&#x27;條件：cleanup 開啟 + GCS FT 開啟 + 非 RocksDB。&#x27;);
  step(&#x27;刪除 head / worker Pods&#x27;,&#x27;head 尚未消失 → requeue + return；後續路徑假設 head 已消失。&#x27;);
  if(o===&#x27;pending&#x27;) {step(&#x27;建立 / 等待 cleanup Job&#x27;,&#x27;Job 未結束且尚未超時 → requeue + return。&#x27;);finish(&#x27;等待中：R 保留，RayCluster 尚不可刪除。&#x27;);return;}
  if(o===&#x27;timeout&#x27;) step(&#x27;達到刪除 timeout → 強制移除 R&#x27;,&#x27;Update → return；不保證 Redis 資料已清除。&#x27;);
  else step(o===&#x27;success&#x27;?&#x27;cleanup Job 成功 → 移除 R&#x27;:&#x27;cleanup Job 失敗 → 仍移除 R&#x27;,&#x27;Update → return；失敗分支也會移除 R。&#x27;);
  if(s===&#x27;both&#x27; &amp;&amp; !proposed) {step(&#x27;下一輪：Finalizers 只剩 [I]&#x27;,&#x27;Redis 設定仍啟用 → 再次進入 cleanup 分支 → return。&#x27;,true);step(&#x27;Idle finalizer 處理永遠不可達&#x27;,&#x27;即使 R 已不存在，Redis 分支仍不會往下走。&#x27;,true);finish(&#x27;P1：卡在 Terminating，I 永遠未移除。&#x27;+(o===&#x27;success&#x27;?&#x27; Redis 資料已清除。&#x27;:&#x27; Redis 資料可能殘留。&#x27;),true);}
  else {step(&#x27;Finalizers：[]&#x27;,&#x27;最後一個 finalizer 已移除。&#x27;);finish(o===&#x27;success&#x27;?&#x27;可完成刪除，Redis cleanup 已成功。&#x27;:&#x27;可完成刪除，但 Redis 資料可能殘留：這是既有失敗／超時政策。&#x27;);}
 }
 for(const control of [mode,scenario,outcome]) control.addEventListener(&#x27;change&#x27;,draw);
 draw();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
